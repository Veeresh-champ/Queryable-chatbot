name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openui_test/package-lock.json
      # The OpenUI validator sidecar runs from openui_test/node_modules.
      - run: npm ci --no-audit --no-fund
        working-directory: openui_test
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openui_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openui_test/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the secret scan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan (Gitleaks, whole history, values redacted)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt
      - name: Python static analysis (Bandit, high severity)
        run: |
          pip install bandit==1.8.6
          bandit -r backend -x "backend/test_*" --severity-level high --confidence-level high
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend runtime dependency audit
        working-directory: openui_test
        # High findings in @openuidev/@ag-ui have no upstream fix yet;
        # fail on critical so new serious issues still stop the build.
        run: npm audit --omit=dev --audit-level=critical

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t queryable-backend .
      - run: docker build --build-arg BACKEND_URL=http://backend:8000 -t queryable-frontend openui_test
